x-production-runtime: &production-runtime
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777
  pids_limit: 256

services:
  db:
    ports: !reset []

  migrate:
    <<: *production-runtime
    environment: &production-backend-environment
      APP_ENV: production
      APP_DOMAIN: ${APP_DOMAIN:-teacher.example.invalid}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-teacher_workspace}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-teacher_workspace}
      SESSION_SECRET: ${SESSION_SECRET:-development-only-replace-me-with-32-characters}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-teacher_workspace_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      TRUSTED_ORIGINS: https://${APP_DOMAIN:-teacher.example.invalid}
      TRUSTED_HOSTS: api,localhost,127.0.0.1
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      REGISTRATION_INVITE_REQUIRED: ${REGISTRATION_INVITE_REQUIRED:-true}
      REGISTRATION_LIMIT_PER_HOUR: ${REGISTRATION_LIMIT_PER_HOUR:-10}
      AUTH_GLOBAL_LIMIT_PER_MINUTE: ${AUTH_GLOBAL_LIMIT_PER_MINUTE:-120}
      ACCOUNT_DELETION_GRACE_DAYS: ${ACCOUNT_DELETION_GRACE_DAYS:-7}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      VISION_AI_PROVIDER: ${VISION_AI_PROVIDER:-mock}
      VISION_OPENAI_MODEL: ${VISION_OPENAI_MODEL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-8192}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_ROOT: /app/var/storage
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-teacher-workspace}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      USER_UPLOAD_QUOTA_BYTES: ${USER_UPLOAD_QUOTA_BYTES:-536870912}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}

  api:
    <<: *production-runtime
    environment: *production-backend-environment
    ports: !reset []

  worker:
    <<: *production-runtime
    environment:
      <<: *production-backend-environment
      WORKER_ID: production-worker

  web:
    <<: *production-runtime
    ports: !reset []

  caddy:
    <<: *production-runtime
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    cap_add:
      - NET_BIND_SERVICE
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
