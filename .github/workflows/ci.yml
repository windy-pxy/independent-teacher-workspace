name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm test:web
      - run: pnpm build:web

  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: apps/backend/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --project apps/backend --all-groups --frozen --no-install-project
      - run: uv run --project apps/backend --no-sync ruff check apps/backend
      - run: uv run --project apps/backend --no-sync mypy apps/backend/src
      - run: uv run --project apps/backend --no-sync pytest apps/backend/tests
      - run: uv build --project apps/backend

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: teacher_workspace
          POSTGRES_USER: teacher_workspace
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teacher_workspace -d teacher_workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: apps/backend/src
      DATABASE_URL: postgresql+asyncpg://teacher_workspace:ci-only-password@localhost:5432/teacher_workspace
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --project apps/backend --all-groups --frozen --no-install-project
      - run: uv run --project apps/backend --no-sync alembic -c apps/backend/alembic.ini upgrade head
      - run: uv run --project apps/backend --no-sync alembic -c apps/backend/alembic.ini downgrade base
      - run: uv run --project apps/backend --no-sync alembic -c apps/backend/alembic.ini upgrade head
      - run: uv run --project apps/backend --no-sync alembic -c apps/backend/alembic.ini check

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.validation.yaml config --quiet

  security:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: apps/backend/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/backend --all-groups --frozen --no-install-project
      - run: pnpm security:static
      - run: pnpm security:dependencies
