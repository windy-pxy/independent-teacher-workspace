name: teacher-workspace

services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teacher_workspace}
      POSTGRES_USER: ${POSTGRES_USER:-teacher_workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: teacher-workspace-backend:local
    command: ["alembic", "-c", "apps/backend/alembic.ini", "upgrade", "head"]
    environment: &backend-environment
      APP_ENV: ${APP_ENV:-development}
      APP_DOMAIN: ${APP_DOMAIN:-teacher.example.invalid}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      APP_CURRENCY: ${APP_CURRENCY:-CNY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-teacher_workspace}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-teacher_workspace}
      SESSION_SECRET: ${SESSION_SECRET:-development-only-replace-me-with-32-characters}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-teacher_workspace_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,test,testserver,api}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      VISION_AI_PROVIDER: ${VISION_AI_PROVIDER:-mock}
      VISION_OPENAI_MODEL: ${VISION_OPENAI_MODEL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-8192}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_ROOT: /app/var/storage
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      ALLOWED_UPLOAD_MIME_TYPES: ${ALLOWED_UPLOAD_MIME_TYPES:-application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/jpeg,image/png,text/plain}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-teacher-workspace}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: teacher-workspace-backend:local
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        HTTP_PROXY: ${DOCKER_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${DOCKER_BUILD_NO_PROXY:-}
    environment: *backend-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - app_storage:/app/var/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    image: teacher-workspace-backend:local
    command: ["python", "-m", "teacher_workspace.worker"]
    environment:
      <<: *backend-environment
      WORKER_ID: compose-worker
    volumes:
      - app_storage:/app/var/storage
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
        HTTP_PROXY: ${DOCKER_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${DOCKER_BUILD_NO_PROXY:-}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  app_storage:
