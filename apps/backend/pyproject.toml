[project]
name = "teacher-workspace-backend"
version = "0.1.0"
description = "FastAPI and worker foundation for the independent teacher workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.17,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.121,<1",
  "openai>=2.7,<3",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.11,<3",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.44,<3",
  "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[project.scripts]
teacher-create-admin = "teacher_workspace.cli:create_admin"
teacher-worker = "teacher_workspace.worker:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teacher_workspace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
